; ESP32_Relay_X2 (ESP32-WROOM-32E). Programming header is not FTDI pinout.
[env:block]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  olikraus/U8g2@^2.35.30
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-unused-const-variable
  -DMODULE_BAHNHOF=0

; Station desk: three track keys, line key, entry-signal key.
[env:bahnhof]
extends = env:block
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-unused-const-variable
  -DMODULE_BAHNHOF=1

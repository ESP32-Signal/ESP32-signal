; ESP32_Relay_X2 (ESP32-WROOM-32E). Programming header is not FTDI pinout.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Wno-unused-const-variable
